services:
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kickzone_app
    restart: unless-stopped
    environment:
      PORT:             3001
      NODE_ENV:         production
      JWT_SECRET:       ${JWT_SECRET}
      JWT_EXPIRES_IN:   ${JWT_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS:  ${ALLOWED_ORIGINS}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
      ADMIN_EMAIL:      ${ADMIN_EMAIL:-admin@kickzone.fr}
      ADMIN_PASSWORD:   ${ADMIN_PASSWORD:-Admin2026!}
      DB_FILE:          /data/kickzone.db
    volumes:
      - db_data:/data          # base SQLite persistante (fichier unique)
    expose:
      - "3001"
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    container_name: kickzone_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./client/dist:/usr/share/nginx/html:ro
    networks:
      - app_net

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
