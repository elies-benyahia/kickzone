# Déploiement de KickZone sur Render (https://render.com) — UN SEUL service.
# Le serveur Node sert à la fois l'API et le build React (client/dist).
#
# Sur Render : New + > Blueprint > sélectionne ce dépôt. Render lit ce fichier.
# Puis dans le service > Environment, renseigne FOOTBALL_API_KEY.

services:
  - type: web
    name: kickzone
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@kickzone.fr
      - key: ADMIN_PASSWORD
        value: Admin2026!
      - key: FOOTBALL_API_KEY
        sync: false
    # Plan gratuit = pas de disque persistant : la base SQLite est recréée et
    # re-remplie automatiquement à chaque redémarrage (seed auto au boot).
